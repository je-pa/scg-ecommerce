server:
  port: 8080
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ecommerce
    password: ecommerce312
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  jwt:
    secret: 7Iqk7YyM66W07YOA7L2U65Sp7YG065+9U3ByaW5n6rCV7J2Y7Yqc7YSw7LWc7JuQ67mI7J6F64uI64ukLg==
  main:
    allow-bean-definition-overriding: true
  application:
    name: scg
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: member
          uri: lb://member
          predicates:
            - name: Path
              args:
                pattern: /api/v0/auth/**
            - name: Path
              args:
                pattern: /api/v0/members/**
        - id: product
          uri: lb://product
          predicates:
            - name: Path
              args:
                pattern: /api/v0/products/**
        - id: order
          uri: lb://order
          predicates:
            - name: Path
              args:
                pattern: /api/v0/orders/**
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url.defaultZone: http://admin:1234@localhost:8761/eureka
  instance:
    hostname: localhost
management:
  endpoint:
    gateway:
      enabled: true
  endpoints:
    web:
      exposure:
        include: gateway

encoder:
  algorithm: AES
  secret-key: mysamplekey05211